name: Build

on:
  # main pushes and pull requests (one run each: a branch with a pull request isn't built twice)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: Editor (${{ matrix.os }})
    # JavaFX's native parts in the jar are for the system it's built on: one jar per system
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build number
        # 1.0 is build 100: the first CI build is 100, then 101, 102...
        run: echo "BUILD=$((99 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build the editor
        working-directory: editor
        run: ./gradlew --no-daemon build -PbuildNumber=$BUILD
      - name: Name the jar for its system
        working-directory: editor/build/libs
        run: |
          mv "uzis-map-editor-1.0-build-$BUILD.jar" "uzis-map-editor-1.0-build-$BUILD-${{ matrix.os }}.jar"
          unzip -p "uzis-map-editor-1.0-build-$BUILD-${{ matrix.os }}.jar" version.properties
          unzip -l "uzis-map-editor-1.0-build-$BUILD-${{ matrix.os }}.jar" AppKt.class
      # Windows: Uzis-Map-Editor.exe, the one-file editor (Java 21 + this build's jar), same build number
      - uses: actions/setup-go@v5
        if: matrix.os == 'windows'
        with:
          go-version: "1.22"
      - name: Build Uzis-Map-Editor.exe
        if: matrix.os == 'windows'
        run: |
          mkdir -p launcher/payload
          cp "editor/build/libs/uzis-map-editor-1.0-build-$BUILD-windows.jar" launcher/payload/editor.jar
          curl -sSfL -o launcher/payload/jre.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
          STAMP=$(date +%s%3N)
          echo "$STAMP" > editor/build/libs/editor-version.txt
          cd launcher && go build -trimpath -ldflags "-s -w -H windowsgui -X main.build=1.0-build-$BUILD -X main.stamp=$STAMP" -o ../editor/build/libs/Uzis-Map-Editor.exe .
          ls -la ../editor/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: uzis-map-editor-1.0-build-${{ env.BUILD }}-${{ matrix.os }}
          path: |
            editor/build/libs/uzis-map-editor-*-build-*-${{ matrix.os }}.jar
            editor/build/libs/Uzis-Map-Editor.exe
            editor/build/libs/editor-version.txt
          if-no-files-found: error
      - name: Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editor-1.0-build-${{ env.BUILD }}
          name: Editor 1.0 (build ${{ env.BUILD }})
          files: |
            editor/build/libs/uzis-map-editor-*-build-*-${{ matrix.os }}.jar
            editor/build/libs/Uzis-Map-Editor.exe
            editor/build/libs/editor-version.txt
          body: "Uzi's Map Editor 1.0, build ${{ env.BUILD }} (commit ${{ github.sha }}). Uzis-Map-Editor.exe is the one-file editor for Windows. Friends get it only when you run Actions > Deploy editor."
      - name: Test build for the pull request (not for friends)
        if: github.event_name == 'pull_request' && matrix.os == 'windows' && github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: editor-pr${{ github.event.number }}-build-${{ env.BUILD }}
          name: Editor test build ${{ env.BUILD }} (PR #${{ github.event.number }})
          target_commitish: ${{ github.event.pull_request.head.sha }}
          prerelease: true
          files: editor/build/libs/Uzis-Map-Editor.exe
          body: "Test build of PR #${{ github.event.number }} (${{ github.event.pull_request.head.sha }}), not merged. Try it here; friends can't get test builds."

  server:
    name: Server compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the server
        working-directory: server
        run: ./gradlew --no-daemon classes
