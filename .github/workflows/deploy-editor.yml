name: Deploy editor

# Sends a built editor to friends: copies it to the public downloads repo, where every Uzis Map Editor.exe looks for
# a newer editor each time it starts. Run it from Actions > Deploy editor > Run workflow.
#
# Repository secret (Settings > Secrets and variables > Actions > Secrets):
#   RELEASES_TOKEN  a GitHub token that can write to the downloads repo (fine-grained token, that one repo,
#                   permission "Contents: Read and write")
# Optional repository variable: RELEASES_REPO (default <owner>/uzis-map-editor-releases)
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number to send (empty = the newest one)"
        required: false
        default: ""

concurrency:
  group: deploy-editor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || format('{0}/uzis-map-editor-releases', github.repository_owner) }}
    steps:
      - name: Check the token is set
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the RELEASES_TOKEN repository secret (a token that can write to $RELEASES_REPO)"; exit 1; fi

      - name: Get the build
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.build }}
        run: |
          if [ -n "$WANT" ]; then TAG="editor-exe-build-$WANT"
          else TAG=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
                 --jq '[.[] | select(.tagName | startswith("editor-exe-build-"))] | sort_by(.createdAt) | last | .tagName')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::No editor exe build found. Merge an editor change first (or run Build editor exe)."; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir out && gh release download "$TAG" --repo "${{ github.repository }}" --dir out
          ls -la out

      - name: Send it to friends
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          BUILD=${TAG#editor-exe-build-}
          gh release create "v$(date -u +%Y%m%d-%H%M)-b$BUILD" out/editor.jar out/editor-version.txt "out/Uzis Map Editor.exe" \
            --repo "$RELEASES_REPO" --latest \
            --title "Uzi's Map Editor 1.0 build $BUILD" \
            --notes "Build $BUILD. Everyone's Uzis Map Editor.exe updates the next time it's opened. New here? Download Uzis Map Editor.exe below."
          echo "Build $BUILD is out: https://github.com/$RELEASES_REPO/releases/latest/download/Uzis.Map.Editor.exe"
